<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publications — Cha Lab.</title>
  <meta name="description" content="Publications of Cha Lab and Prof. Hyungyeon Cha: Ni-rich cathodes, single-crystal cathodes, dry electrodes, all-solid-state batteries, silicon anodes.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>(function(){var t=localStorage.getItem('chalab-theme');if(t)document.documentElement.setAttribute('data-theme',t);var l=localStorage.getItem('chalab-lang');if(l)document.documentElement.setAttribute('data-lang',l);})();</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header" id="site-header"></header>

<main id="main">
  <section class="page-hero">
    <div class="wrap">
      <div class="eyebrow"><span class="en">Publications</span><span class="ko">논문</span></div>
      <h1><span class="en">Publications</span><span class="ko">연구 논문</span></h1>
      <p class="lead"><span class="en">Journal articles, patents and book chapters. Conference abstracts are omitted. The full record is on <a href="https://scholar.google.co.kr/citations?user=St7bsSAAAAAJ&hl=en" target="_blank" rel="noopener" style="color:var(--mint)">Google Scholar</a>.</span><span class="ko">학술지 논문, 특허, 단행본. 학회 초록은 제외했습니다. 전체 기록은 <a href="https://scholar.google.co.kr/citations?user=St7bsSAAAAAJ&hl=ko" target="_blank" rel="noopener" style="color:var(--mint)">Google Scholar</a>에서 볼 수 있습니다.</span></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="pub-tools">
        <label class="pub-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="pub-q" type="search" placeholder="Search title, author, journal…" aria-label="Search publications">
        </label>
        <div class="chips" id="pub-filters">
          <button class="chip active" data-f="all"><span class="en">All</span><span class="ko">전체</span></button>
          <button class="chip" data-f="lead"><span class="en">Lead author</span><span class="ko">주저자</span></button>
          <button class="chip" data-f="other"><span class="en">Patents &amp; chapters</span><span class="ko">특허·단행본</span></button>
        </div>
        <span class="pub-count" id="pub-count"></span>
      </div>
      <div id="pub-root"></div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/partials.js"></script>
<script src="assets/js/publications.js"></script>
<script src="assets/js/main.js"></script>
<script>
(function () {
  const root = document.getElementById('pub-root');
  const q = document.getElementById('pub-q');
  const count = document.getElementById('pub-count');
  let filter = 'all';

  function matches(p, term) {
    if (filter === 'lead' && !p.lead) return false;
    if (filter === 'other' && !(p.type === 'patent' || p.type === 'chapter')) return false;
    if (!term) return true;
    return (p.title + ' ' + p.authors + ' ' + p.journal + ' ' + p.year).toLowerCase().includes(term);
  }

  function render() {
    const term = q.value.trim().toLowerCase();
    const list = PUBLICATIONS.filter((p) => matches(p, term));
    const byYear = {};
    list.forEach((p) => (byYear[p.year] = byYear[p.year] || []).push(p));
    const years = Object.keys(byYear).sort((a, b) => b - a);
    const lang = document.documentElement.getAttribute('data-lang') || 'en';
    count.innerHTML = `<span class="en">${list.length} of ${PUBLICATIONS.length} publications</span><span class="ko">총 ${PUBLICATIONS.length}편 중 ${list.length}편</span>`;
    if (!years.length) { root.innerHTML = '<div class="empty"><span class="en">No publications match.</span><span class="ko">일치하는 논문이 없습니다.</span></div>'; return; }
    root.innerHTML = years.map((y) => `
      <section class="pub-year">
        <h3>${y}</h3>
        <ul class="pub-list">
          ${byYear[y].map((p) => {
            const link = p.doi ? 'https://doi.org/' + p.doi : ChaLab.scholarLink(p.title);
            const t = ChaLab.typeLabel[p.type] || ChaLab.typeLabel.article;
            return `<li class="pub">
              <span class="title"><a href="${link}" target="_blank" rel="noopener">${p.title}</a></span>
              <span class="authors">${ChaLab.highlightPI(p.authors)}</span>
              <span class="venue"><i>${p.journal}</i> ${p.year}, ${p.ref}</span>
              <span class="meta">
                ${p.type !== 'article' ? `<span class="tag" style="background:var(--bg-alt);color:var(--muted)"><span class="en">${t.en}</span><span class="ko">${t.ko}</span></span>` : ''}
                ${p.lead ? '<span class="tag"><span class="en">Lead author</span><span class="ko">주저자</span></span>' : ''}
                ${p.cover ? '<span class="tag"><span class="en">Journal cover</span><span class="ko">저널 표지</span></span>' : ''}
                <a href="${link}" target="_blank" rel="noopener">${p.doi ? 'DOI ↗' : '<span class="en">Scholar ↗</span><span class="ko">Scholar ↗</span>'}</a>
              </span>
            </li>`;
          }).join('')}
        </ul>
      </section>`).join('');
  }

  document.getElementById('pub-filters').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    document.querySelectorAll('#pub-filters .chip').forEach((c) => c.classList.remove('active'));
    b.classList.add('active'); filter = b.dataset.f; render();
  });
  q.addEventListener('input', render);
  document.addEventListener('langchange', () => { q.placeholder = document.documentElement.getAttribute('data-lang') === 'ko' ? '제목, 저자, 저널 검색…' : 'Search title, author, journal…'; });
  document.dispatchEvent(new Event('langchange'));
  render();
})();
</script>
</body>
</html>
